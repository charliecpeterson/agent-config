# manifest.toml — declarative control plane for the agent-config generator.
# Read-only (parsed via stdlib tomllib; nothing writes it back).
#
# Drives every harness adapter: the rules, the portable-skill list, and the
# per-harness MCP targeting below. All five adapters (claude/codex/opencode/
# crush/pi) are implemented. See SUPPORT.md for what renders where.

[meta]
repo_name = "agent-config"

# The neutral content source for the instructions/prompt layer. Order is the
# @import order in the generated CLAUDE.md and the concat order in AGENTS.md.
[rules]
files = ["userprofile.md", "style.md", "communication.md", "engineering.md"]
# Preamble for the generated Claude CLAUDE.md, before the @import lines. The
# generator rstrips it and appends a blank line + one @import per rule file, so
# trailing-newline handling here is irrelevant.
claude_preamble = """
# Global instructions

These rules apply to every project unless a project-level `CLAUDE.md`
overrides them. Project files take precedence on conflict.
"""

[skills]
# Portable skills are exported to ~/.agents/skills and registered with Codex.
# They may request worker fan-out where a harness supports it, but must retain a
# reduced-coverage fallback for harnesses without subagents. Everything else is
# Claude-only.
# Skills themselves are auto-discovered from skills/*/SKILL.md.
portable = [
  "bug-hunter",
  "bug-scan",
  "differential-test",
  "doc-grounded",
  "dyslexia-friendly",
  "editor",
  "env-triage",
  "human-writer",
  "presentation-designer",
  "project-starter",
  "recent-research",
  "session-handoff",
  "stampede3-debug",
  "stampede3-submit",
]

# Source agents are always installed for Claude. These are also rendered into
# the named harnesses in their native formats.
[agent.code-skeptic]
targets = ["codex", "opencode"]

# Nonportable skills deliberately exposed to a harness. Portable skills go via
# ~/.agents/skills; this bypasses that shared directory for one named harness.
[skill.code-review-deep]
targets = ["opencode"]

# Machine profiles (machines/<name>.md), matched against this host at render
# time — first glob match wins. The matched profile renders as "this machine";
# the rest render as the available fleet. Unmatched hosts fall back to
# ~/.agent-config/machine.local.md (hand-written, never synced), then
# machines/other.md.
[machine.mac-studio]
hosts = ["charlie-m2studio*"]

[machine.macbook-air]
hosts = ["Charless-MacBook-Air.local"]

[machine.linux-4090]
hosts = ["charliebox"]

[machine.dgxspark]
hosts = ["dgxspark", "spark-b56c"]

[machine.hoffman2]
hosts = ["loginh2", "login*.hoffman2.oarc.ucla.edu"]

[machine.stampede3]
hosts = ["*stampede3.tacc.utexas.edu"]

[machine.anvil]
hosts = ["*.anvil.rcac.purdue.edu"]

[harness.claude]
config_dir = "~/.claude"
strategy = "separate-file"   # copies into ~/.claude; settings.json is a copy

[harness.codex]
config_dir = "~/.codex"
strategy = "keyed-merge"     # config.toml is shared; AGENTS.md is a separate file
tested_against = "rust-v0.140.0"

[harness.opencode]
config_dir = "~/.config/opencode"
strategy = "keyed-merge"     # opencode.json (plain JSON); AGENTS.md separate
tested_against = "2026-07"

[harness.crush]
config_dir = "~/.config/crush"
strategy = "keyed-merge"     # crush.json (plain JSON); CRUSH.md separate
tested_against = "2026-06"

[harness.pi]
config_dir = "~/.pi/agent"   # pi reads a global AGENTS.md here
strategy = "separate-file"   # rules only; pi has no native MCP
tested_against = "0.79.0"

# MCP servers to auto-register into each harness's native config (D4).
# `targets` = harness names, or ["*"] for all. `command` is the launch command
# (a ~/mcps/bin/<name>-run wrapper, or an explicit command + args). Secrets stay
# in the MCP's own .env — never in a generated config. Add your own here; the
# wrapper-based ones below are examples. (Claude registration stays manual via
# `claude mcp add --scope local`; targeting Claude here is for future use.)
[mcp.transcribemcp]
command = "~/mcps/bin/transcribemcp-run"
targets = ["codex", "opencode", "crush"]
